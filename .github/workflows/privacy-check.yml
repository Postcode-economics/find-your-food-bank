# Read-only privacy check (Dean approved 26 Oct 2026). Manual trigger only.
# Scans every listing and public page (repo copy served by Pages, plus live helpmap.uk)
# for PRIVATE_BLOCKLIST entries. Prints counts only. Never publishes or writes.
name: Privacy check (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: privacy-check
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Scan listings and pages (counts only)
        env:
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: python scripts/privacy_check.py --live
