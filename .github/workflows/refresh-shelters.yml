name: Refresh Shelters layer
on:
  schedule:
    - cron: "41 4,12,20 * * *"   # three runs a day (UTC); every run re-fetches every evidence page
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # failed or partial runs open a 'refresh-alert' issue (scripts/alert.py)
concurrency:
  group: refresh-shelters
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the verification checks
        run: python -m unittest discover -s tests -v
      - name: Rebuild shelters.js (re-fetches and re-checks every source page)
        run: python scripts/build_shelters.py
      - name: Every entry has a phone or a labelled council fallback (overrides/*_contacts.json)
        run: python scripts/shelter_contacts.py check
      - name: Refuse to publish without fresh verification
        run: python scripts/verify_fresh.py shelters
      - name: Refresh guard - keep any place, phone or opening times this run would drop (report + alert, scripts/refresh_guard.py)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh_guard.py shelters
      - name: SWEP watch (council severe-weather pages; flags only, never changes the map)
        id: swep
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/swep.py
      - name: Review list for Dean (adds, removals, tier flips, opens-later, SWEP changes)
        id: review
        continue-on-error: true
        run: python scripts/layer_review.py
      - name: Rebuild area pages (incl. /shelters/<area>/), sitemap.xml (fail-safe)
        continue-on-error: true
        run: python scripts/build_seo.py
      - name: Stamp this run's UK date and time (map 'Updated today at' line)
        run: python scripts/stamp.py write shelters && python scripts/stamp.py verify
      - name: Page dates - WebPage/Dataset/FAQ JSON-LD dateModified, home 'Updated' line, sitemap.xml lastmod (fail-safe)
        continue-on-error: true
        run: python scripts/seo_meta.py
      - name: Commit if changed
        run: |
          git add stamp.js index.html faq.html terms.html privacy.html accessibility.html food-banks warm-spaces shelters sitemap.xml robots.txt 404.html logs/discovery_today_shelters.json reports/new_today.md reports/manual_review.md shelters.js logs/shelters_discovery.json logs/shelters_times_check.json logs/shelters_log.json logs/shelters_pending.json logs/shelters_recheck.json logs/shelters_last_confirmed.json reports/shelters_grace.md logs/swep_status.json reports/layers_review.md reports/layers_review.json overrides/district_cache.json logs/refresh_guard.json reports/refresh_guard_shelters.md
          # district_cache.json is rewritten by build_seo.py; left unstaged it made 'git pull --rebase' refuse (07:41 + 19:44 23 Oct)
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "3x-daily Shelters refresh $(date -u +%F)"
          # shared reports (new_today / manual_review / layers_review) may have been changed by another refresh meanwhile:
          # keep this run's files, then rebuild the discovery reports from every layer's log so nobody's entries are lost
          for n in 1 2 3; do
            if git pull --rebase -X theirs; then
              python scripts/discovery_rules.py render || true
              { python scripts/build_seo.py && python scripts/seo_meta.py; } || echo "::warning::page rebuild after merge failed"
              git add -A food-banks warm-spaces shelters sitemap.xml robots.txt 404.html index.html faq.html terms.html privacy.html accessibility.html overrides/district_cache.json
              git add reports/new_today.md reports/manual_review.md
              git diff --cached --quiet || git commit -m "Reports and area pages rebuilt after merge"
              if git push; then exit 0; fi
            else
              # conflicts -X theirs can't settle (e.g. an area page deleted by one run, rewritten by another): keep this run's version
              for f in $(git diff --name-only --diff-filter=U); do
                if git cat-file -e ":3:$f" 2>/dev/null; then git checkout --theirs -- "$f" && git add -- "$f"; else git rm -q -- "$f"; fi
              done
              if GIT_EDITOR=true git rebase --continue; then
                python scripts/discovery_rules.py render || true
              { python scripts/build_seo.py && python scripts/seo_meta.py; } || echo "::warning::page rebuild after merge failed"
              git add -A food-banks warm-spaces shelters sitemap.xml robots.txt 404.html index.html faq.html terms.html privacy.html accessibility.html overrides/district_cache.json
                git add reports/new_today.md reports/manual_review.md
                git diff --cached --quiet || git commit -m "Reports and area pages rebuilt after merge"
                if git push; then exit 0; fi
              else git rebase --abort 2>/dev/null || true; fi
            fi
            sleep $((n * 10))
          done
          exit 1
      - name: IndexNow - tell search engines which pages really changed (fail-safe)
        continue-on-error: true
        run: python scripts/indexnow.py "$GITHUB_SHA"
      - name: Alert - run failed (nothing new published)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py open shelters "Shelters refresh run failed" "A step failed, so this run did not publish. Earlier data stays live. Open the run log to see which step."
      - name: Clear the run alert after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve shelters
      - name: Alert - SWEP watch or review list failed (data still published)
        if: always() && (steps.swep.outcome == 'failure' || steps.review.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py open swep "SWEP watch / review list failed" "swep.py or layer_review.py failed this run. Shelters data was still checked and published as normal."
      - name: Clear the SWEP alert after a good run
        if: success() && steps.swep.outcome == 'success' && steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve swep
