name: Refresh Shelters layer
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-shelters
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild shelters.js
        run: python scripts/build_shelters.py
      - name: Commit if changed
        run: |
          git add shelters.js logs/shelters_log.json logs/shelters_pending.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily Shelters refresh $(date -u +%F)"
          git pull --rebase && git push
