name: Change alert
# Opens a GitHub issue (GitHub emails @Postcode-economics) when main gets a commit
# that did not come from the scheduled jobs (github-actions[bot]). Read-only on code.
on:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check commits and alert
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ toJson(github.event) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          ev = json.loads(os.environ['EVENT'])
          bot = 'github-actions[bot]'
          odd = [c for c in ev.get('commits', [])
                 if c['author'].get('name') != bot or c['committer'].get('name') != bot]
          if not odd:
              print('All commits from scheduled jobs; no alert.'); raise SystemExit
          lines = ['A change was pushed to main that did not come from the scheduled jobs.', '',
                   f"Pushed by: {ev.get('pusher',{}).get('name')}", f"Compare: {ev.get('compare')}", '']
          for c in odd:
              files = c.get('added',[]) + c.get('modified',[]) + c.get('removed',[])
              lines += [f"- {c['id'][:10]} by {c['author'].get('name')} (committer {c['committer'].get('name')})",
                        f"  {c['message'].splitlines()[0]}",
                        '  Files: ' + (', '.join(files[:40]) or '(none listed)'), '']
          lines += ['If you did not make this change, check it straight away.', '', '@Postcode-economics']
          r = subprocess.run(['gh','issue','create','-R',os.environ['GITHUB_REPOSITORY'],
                              '--title', f"Change alert: {len(odd)} non-automatic commit(s) on main",
                              '--assignee','Postcode-economics','--body','\n'.join(lines)],
                             capture_output=True, text=True)
          print(r.stdout, r.stderr)
          if r.returncode: raise SystemExit(r.returncode)
          PY
