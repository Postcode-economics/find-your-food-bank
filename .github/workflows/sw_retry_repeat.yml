# Scratch probe (not for merge): run test_sw_cache_retry 30x with the old wait and 30x with the fix, CI setup.
name: sw-retry-repeat
on:
  push:
    branches: ['ci-probe/sw-cache-retry-30x']
jobs:
  repeat:
    strategy: {fail-fast: false, matrix: {which: [old, new]}}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pytest==9.1.1 playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null
      - uses: ./.github/actions/offline-tiles
      - run: |
          f=tests/test_sw_cache_retry.py; [ "${{ matrix.which }}" = old ] && f=tests/old_sw_cache_retry_probe.py
          pass=0; fail=0
          for i in $(seq 30); do
            if python -m pytest -q -p no:cacheprovider "$f" > out.txt 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "run $i FAILED:"; grep -E "AssertionError|ERR_" out.txt | head -3; fi
          done
          echo "RESULT ${{ matrix.which }} pass=$pass fail=$fail"
