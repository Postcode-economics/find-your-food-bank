# Point 12 (24 Oct 2026): run the test suite on every branch push and pull request. Read-only; never deploys.
name: tests
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==9.1.1
      - run: python -m pytest -q tests
