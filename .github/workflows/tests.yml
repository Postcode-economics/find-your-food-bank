# Point 12 (24 Oct 2026): run the test suite on every branch push and pull request. Read-only; never deploys.
name: tests
on:
  push:
    # Release tags only carry data assets (e.g. the offline map); their commit is already tested on main.
    tags-ignore: ['offline-map-*']
    branches: ['**']
  pull_request:
# One run per branch. A push and the pull request for that branch share it, and a newer
# push cancels the older run. This account can run 20 jobs at once. Without this, every
# commit queued five jobs twice (the push and the pull request), and the long browser
# jobs filled that cap, so main's tests, the deploy check, Pages and the watchdog waited.
concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    # Queue old-links, browser-tests, design-lock and journeys only when this diff can change
    # what they look at. A commit that only touches learning scripts was still holding a
    # runner for each of them. The plain pytest job always runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.f.outputs.browser }}
      oldlinks: ${{ steps.f.outputs.oldlinks }}
      design: ${{ steps.f.outputs.design }}
      journeys: ${{ steps.f.outputs.journeys }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          browser=1; oldlinks=1; design=1; journeys=1
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          run_all=1
          files=""
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            files=$(gh api "repos/${{ github.repository }}/compare/${base}...${head}" --jq '.files[].filename' 2>/tmp/changes.err)
            code=$?
            n=$(printf '%s\n' "$files" | grep -c . || true)
            if [ "$code" -eq 0 ] && [ "$n" -lt 300 ]; then run_all=0
            else echo "diff unavailable (exit $code, files $n); running every check"; sed -n '1,15p' /tmp/changes.err; fi
          else echo "no base commit; running every check"; fi
          if [ "$run_all" -eq 0 ]; then
            browser=0; oldlinks=0; design=0; journeys=0
            while IFS= read -r f || [ -n "$f" ]; do
              [ -n "$f" ] || continue
              case "$f" in
                tests/fixtures/*) ;;
                *.html|*.css|*.js) browser=1; oldlinks=1; design=1; journeys=1 ;;
                scripts/old_links.py|scripts/old_links.json) oldlinks=1 ;;
                scripts/design_lock.py|scripts/design_lock.json) design=1 ;;
                scripts/journeys.py|scripts/check_browser.py) journeys=1; browser=1; oldlinks=1; design=1 ;;
                tests/site_ready.py) browser=1 ;;
                .github/workflows/tests.yml) browser=1; oldlinks=1; design=1; journeys=1 ;;
                tests/*.py) if [ ! -f "$f" ] || grep -q playwright "$f"; then browser=1; fi ;;
              esac
            done <<< "$files"
          fi
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
          echo "oldlinks=$oldlinks" >> "$GITHUB_OUTPUT"
          echo "design=$design" >> "$GITHUB_OUTPUT"
          echo "journeys=$journeys" >> "$GITHUB_OUTPUT"
          echo "browser=$browser oldlinks=$oldlinks design=$design journeys=$journeys"
          exit 0
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml
      - run: pip install pytest==9.1.1
      - run: python -m pytest -q tests
      # Alert-only for one week (Dean 27 Oct 2026): reports date mismatches as warnings, never fails.
      - name: Date check (alert-only)
        continue-on-error: true
        run: python scripts/date_check.py
  old-links:
    needs: changes
    if: needs.changes.outputs.oldlinks == '1'
    # Dean 25 Oct 2026 (permanent): every link ever sent out, plus app-added forms (?igsh/?utm/?fbclid, hashes, old paths),
    # opened with an OLD service worker installed and the Instagram in-app UA, must show the map and listings.
    # The 100 cases took ~31 min in one job (~18 s each), so OLD_LINKS_SHARD gives each of 4 jobs every 4th case.
    # The old-links job below is the check to require.
    name: old-links shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30  # real offline tiles are rendered on the runner; ~9 min per shard
    env:
      OLD_LINKS_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - uses: ./.github/actions/offline-tiles
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.47.0-chromium
      - run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/old_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: old-links-shard-${{ matrix.shard }}
          path: logs/old_links.json
          if-no-files-found: error
          retention-days: 7
  old-links-all:
    # Passes only if every shard passed and the shards' reports hold each case (old release, link, UA) exactly once, all ok.
    name: old-links
    needs: [changes, old-links]
    if: ${{ !cancelled() && needs.changes.outputs.oldlinks == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - run: pip install -q playwright==1.47.0
      - uses: actions/download-artifact@v4
        with: {pattern: old-links-shard-*, path: shards}
      - name: Every case ran exactly once and passed
        run: |
          python - <<'EOF'
          import collections, glob, json, sys
          sys.path.insert(0, 'scripts'); import old_links
          want = collections.Counter(old_links.cases())
          files = sorted(glob.glob('shards/*/old_links.json'))
          rows = [r for f in files for r in json.load(open(f))]
          got = collections.Counter((r['old'], r['link'], r['ua']) for r in rows)
          bad = [r for r in rows if not r.get('ok')]
          print('%d shard reports; %d cases expected, %d reported, %d passed, %d failed' % (len(files), sum(want.values()), len(rows), len(rows) - len(bad), len(bad)))
          for r in bad: print('::error::FAIL %s %s %s: %s' % (r['old'], r['ua'], r['link'], r.get('why')))
          missing, extra = want - got, got - want
          for name, items in (('not run', missing), ('run twice or not a case', extra)):
              for k, n in sorted(items.items()): print('::error::%s: %s %s %s (x%d)' % (name, k[0], k[2], k[1], n))
          sys.exit(1 if len(files) != 4 or bad or missing or extra else 0)
          EOF
      - name: All shards passed
        if: always()
        run: |
          test "${{ needs.old-links.result }}" = success || { echo "::error::old-links shards: ${{ needs.old-links.result }}"; exit 1; }
  journeys:
    needs: changes
    if: needs.changes.outputs.journeys == '1'
    # Dean 25 Oct 2026 (permanent rule): the real-click user-journey suite must pass before any site change merges
    # (all three types, 390/1366 px, light/dark). Runs on every push / PR that touches site html/css/js.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # the PR base must be present, or the site-change diff fails and journeys silently skip
      - id: site
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git diff --name-only "$base" HEAD 2>/dev/null | grep -Eq '\.(html|css|js)$|^scripts/journeys\.py$|^scripts/check_browser\.py$'; then echo run=1 >> "$GITHUB_OUTPUT"; else echo run=0 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.site.outputs.run == '1'
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - if: steps.site.outputs.run == '1'
        uses: ./.github/actions/offline-tiles
      - if: steps.site.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.47.0-chromium
      - if: steps.site.outputs.run == '1'
        run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/journeys.py
  browser-tests:
    needs: changes
    if: needs.changes.outputs.browser == '1'
    # Dean 25 Oct 2026: browser tests (status line never cut off, list panel alignment, open-today, two-finger note, ...)
    # really run here; the plain test job has no Playwright so it skips them.
    # The suite took ~35 min in one job, so pytest-split runs it as 6 contiguous chunks balanced by tests/.test_durations
    # (tests missing from that file count as the average). The browser-tests job below is the check to require.
    name: browser-tests shard ${{ matrix.group }}/6
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.47.0-chromium
      - run: pip install -q pytest==9.1.1 pytest-split==0.11.0 playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null
      - uses: ./.github/actions/offline-tiles
      - run: python -m pytest -q tests -rs --splits 6 --group ${{ matrix.group }} --durations-path tests/.test_durations --junitxml=shard.xml
      # Chrome binary guard: the Chrome checks skip themselves without /usr/bin/google-chrome, so the job must not go green
      # without it. A separate step so pytest is still started on its own (test_iphone_journeys Wiring).
      - name: Chrome binary guard
        if: always()
        run: test -x /usr/bin/google-chrome || { echo "::error::/usr/bin/google-chrome missing; the Chrome browser tests were skipped"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-tests-shard-${{ matrix.group }}
          path: shard.xml
          if-no-files-found: error
          retention-days: 7
  browser-tests-all:
    # Passes only if every shard passed and the shards' JUnit reports hold each collected test exactly once.
    name: browser-tests
    needs: [changes, browser-tests]
    if: ${{ !cancelled() && needs.changes.outputs.browser == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - run: pip install -q pytest==9.1.1 playwright==1.47.0
      - uses: actions/download-artifact@v4
        with: {pattern: browser-tests-shard-*, path: shards}
      - name: Every test ran exactly once
        run: |
          python -m pytest -q tests --collect-only > collected.txt || { tail -20 collected.txt; exit 1; }
          python - <<'EOF'
          import collections, glob, sys
          import xml.etree.ElementTree as ET
          def address(nodeid):  # same mangling as pytest's junitxml
              path, *rest = nodeid.split('::')
              names = [path.replace('.py', '').replace('/', '.')] + rest
              return '.'.join(names[:-1]), names[-1]
          want = collections.Counter(address(l) for l in open('collected.txt').read().splitlines() if '::' in l)
          got, totals = collections.Counter(), collections.Counter()
          files = sorted(glob.glob('shards/*/shard.xml'))
          for f in files:
              for case in ET.parse(f).iter('testcase'):
                  got[(case.get('classname'), case.get('name'))] += 1
                  kids = {k.tag: k for k in case}
                  if 'failure' in kids or 'error' in kids: totals['failed/error'] += 1
                  elif 'skipped' in kids: totals['xfailed' if kids['skipped'].get('type') == 'pytest.xfail' else 'skipped'] += 1
                  else: totals['passed'] += 1
          print('%d shard reports; collected %d, reported %d: %s' % (len(files), sum(want.values()), sum(got.values()),
                ', '.join('%d %s' % (totals[k], k) for k in ('passed', 'skipped', 'xfailed', 'failed/error'))))
          missing, extra = want - got, got - want
          for name, items in (('not run', missing), ('run twice or not collected', extra)):
              for k, n in sorted(items.items())[:50]: print('::error::%s: %s::%s (x%d)' % (name, k[0], k[1], n))
          sys.exit(1 if len(files) != 6 or missing or extra else 0)
          EOF
      - name: All shards passed
        if: always()
        run: |
          test "${{ needs.browser-tests.result }}" = success || { echo "::error::browser-tests shards: ${{ needs.browser-tests.result }}"; exit 1; }
  design-lock:
    needs: changes
    if: needs.changes.outputs.design == '1'
    # Dean 25 Oct 2026 (permanent): card design lock - call/directions/share/FB/links/report/dots/badges/tap targets,
    # list cards and pin pop-ups, all 3 types, 390/1366, light/dark.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.47.0-chromium
      - run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/design_lock.py
  iphone-webkit:
    needs: changes
    if: needs.changes.outputs.browser == '1'
    # Dean 27 Oct 2026: the page froze on his iPhone once the map switched to the OpenFreeMap backup.
    # Real WebKit, iPhone 13 profile, normal map and forced backup: no stall over 500 ms after the map loads,
    # M1 1AE search, filters, Open today and scrolling all respond. Stand-in tiles only, no real network.
    # test_iphone_backup_map: iPhone 13 + SE, backup off/on, service worker on/off, blocked at the network layer
    # (local proxy) so the block holds for service-worker fetches too; the backup must paint.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # the old-worker tests read sw.js from earlier commits
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.47.0-webkit
      - run: pip install -q pytest==9.1.1 playwright==1.47.0 && python -m playwright install --with-deps webkit >/dev/null
      # 27 Oct 2026: the iPhone map-fix and stale-worker WebKit tests were skipped everywhere (browser-tests has no WebKit).
      # The vector fallback check uses a TLS proxy with the service worker allowed. It does not use route() with the worker blocked.
      - run: python -m pytest -q -rsx tests/test_iphone_responsive.py tests/test_iphone_map_fix.py tests/test_sw_tag_hash.py tests/test_webkit_instagram.py tests/test_iphone_freeze.py tests/test_iphone_vector_recover.py tests/test_iphone_decode.py tests/test_iphone_backup_map.py tests/test_phone_qa_28oct.py tests/test_motion_28oct_3.py tests/test_website_link.py tests/test_zoom_no_grey.py
  iphone-journeys:
    needs: changes
    if: needs.changes.outputs.browser == '1'
    # Dean 27 Oct 2026: iPhone 13 and iPhone SE, service worker on and off, stand-in tiles via a local TLS proxy.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: .github/workflows/tests.yml}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.47.0-webkit
      - run: pip install -q pytest==9.1.1 playwright==1.47.0 && python -m playwright install --with-deps webkit >/dev/null
      - run: python -m pytest -q -rs tests/test_iphone_journeys.py
