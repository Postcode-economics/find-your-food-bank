name: tests
on: {push: {branches: ['diag-209']}}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy: {fail-fast: false, matrix: {n: [1, 2, 3]}}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pytest==9.1.1 playwright==1.47.0 && python -m playwright install --with-deps webkit >/dev/null
      - run: python -m pytest -q -rsx tests/test_sw_tag_hash.py -k StaleWorker || true
      - run: for i in 1 2 3 4; do python -u tests/test_iphone_freeze.py 13-on 2>&1 | tail -14; done
