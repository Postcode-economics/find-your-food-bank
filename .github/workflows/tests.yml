# Point 12 (24 Oct 2026): run the test suite on every branch push and pull request. Read-only; never deploys.
        with: {fetch-depth: 0}
name: tests
        with: {fetch-depth: 0}
on:
        with: {fetch-depth: 0}
  push:
        with: {fetch-depth: 0}
  pull_request:
        with: {fetch-depth: 0}
# One run per branch. A push and the pull request for that branch share it, and a newer
        with: {fetch-depth: 0}
# push cancels the older run. This account can run 20 jobs at once. Without this, every
        with: {fetch-depth: 0}
# commit queued five jobs twice (the push and the pull request), and the long browser
        with: {fetch-depth: 0}
# jobs filled that cap, so main's tests, the deploy check, Pages and the watchdog waited.
        with: {fetch-depth: 0}
concurrency:
        with: {fetch-depth: 0}
  group: tests-${{ github.head_ref || github.ref_name }}
        with: {fetch-depth: 0}
  cancel-in-progress: true
        with: {fetch-depth: 0}
permissions:
        with: {fetch-depth: 0}
  contents: read
        with: {fetch-depth: 0}
jobs:
        with: {fetch-depth: 0}
  changes:
        with: {fetch-depth: 0}
    # Queue old-links, browser-tests, design-lock and journeys only when this diff can change
        with: {fetch-depth: 0}
    # what they look at. A commit that only touches learning scripts was still holding a
        with: {fetch-depth: 0}
    # runner for each of them. The plain pytest job always runs.
        with: {fetch-depth: 0}
    runs-on: ubuntu-latest
        with: {fetch-depth: 0}
    timeout-minutes: 5
        with: {fetch-depth: 0}
    outputs:
        with: {fetch-depth: 0}
      browser: ${{ steps.f.outputs.browser }}
        with: {fetch-depth: 0}
      oldlinks: ${{ steps.f.outputs.oldlinks }}
        with: {fetch-depth: 0}
      design: ${{ steps.f.outputs.design }}
        with: {fetch-depth: 0}
      journeys: ${{ steps.f.outputs.journeys }}
        with: {fetch-depth: 0}
    steps:
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
        with: {fetch-depth: 1}
        with: {fetch-depth: 0}
      - id: f
        with: {fetch-depth: 0}
        env:
        with: {fetch-depth: 0}
          GH_TOKEN: ${{ github.token }}
        with: {fetch-depth: 0}
        run: |
        with: {fetch-depth: 0}
          set +e
        with: {fetch-depth: 0}
          browser=1; oldlinks=1; design=1; journeys=1
        with: {fetch-depth: 0}
          if [ "${{ github.event_name }}" = "pull_request" ]; then
        with: {fetch-depth: 0}
            base="${{ github.event.pull_request.base.sha }}"
        with: {fetch-depth: 0}
            head="${{ github.event.pull_request.head.sha }}"
        with: {fetch-depth: 0}
          else
        with: {fetch-depth: 0}
            base="${{ github.event.before }}"
        with: {fetch-depth: 0}
            head="${{ github.sha }}"
        with: {fetch-depth: 0}
          fi
        with: {fetch-depth: 0}
          run_all=1
        with: {fetch-depth: 0}
          files=""
        with: {fetch-depth: 0}
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
        with: {fetch-depth: 0}
            files=$(gh api "repos/${{ github.repository }}/compare/${base}...${head}" --jq '.files[].filename' 2>/tmp/changes.err)
        with: {fetch-depth: 0}
            code=$?
        with: {fetch-depth: 0}
            n=$(printf '%s\n' "$files" | grep -c . || true)
        with: {fetch-depth: 0}
            if [ "$code" -eq 0 ] && [ "$n" -lt 300 ]; then run_all=0
        with: {fetch-depth: 0}
            else echo "diff unavailable (exit $code, files $n); running every check"; sed -n '1,15p' /tmp/changes.err; fi
        with: {fetch-depth: 0}
          else echo "no base commit; running every check"; fi
        with: {fetch-depth: 0}
          if [ "$run_all" -eq 0 ]; then
        with: {fetch-depth: 0}
            browser=0; oldlinks=0; design=0; journeys=0
        with: {fetch-depth: 0}
            while IFS= read -r f || [ -n "$f" ]; do
        with: {fetch-depth: 0}
              [ -n "$f" ] || continue
        with: {fetch-depth: 0}
              case "$f" in
        with: {fetch-depth: 0}
                tests/fixtures/*) ;;
        with: {fetch-depth: 0}
                *.html|*.css|*.js) browser=1; oldlinks=1; design=1; journeys=1 ;;
        with: {fetch-depth: 0}
                scripts/old_links.py|scripts/old_links.json) oldlinks=1 ;;
        with: {fetch-depth: 0}
                scripts/design_lock.py|scripts/design_lock.json) design=1 ;;
        with: {fetch-depth: 0}
                scripts/journeys.py|scripts/check_browser.py) journeys=1; browser=1; oldlinks=1; design=1 ;;
        with: {fetch-depth: 0}
                tests/site_ready.py) browser=1 ;;
        with: {fetch-depth: 0}
                .github/workflows/tests.yml) browser=1; oldlinks=1; design=1; journeys=1 ;;
        with: {fetch-depth: 0}
                tests/*.py) if [ ! -f "$f" ] || grep -q playwright "$f"; then browser=1; fi ;;
        with: {fetch-depth: 0}
              esac
        with: {fetch-depth: 0}
            done <<< "$files"
        with: {fetch-depth: 0}
          fi
        with: {fetch-depth: 0}
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
        with: {fetch-depth: 0}
          echo "oldlinks=$oldlinks" >> "$GITHUB_OUTPUT"
        with: {fetch-depth: 0}
          echo "design=$design" >> "$GITHUB_OUTPUT"
        with: {fetch-depth: 0}
          echo "journeys=$journeys" >> "$GITHUB_OUTPUT"
        with: {fetch-depth: 0}
          echo "browser=$browser oldlinks=$oldlinks design=$design journeys=$journeys"
        with: {fetch-depth: 0}
          exit 0
        with: {fetch-depth: 0}
  test:
        with: {fetch-depth: 0}
    runs-on: ubuntu-latest
        with: {fetch-depth: 0}
    timeout-minutes: 15
        with: {fetch-depth: 0}
    steps:
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
        with: {fetch-depth: 0}
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {fetch-depth: 0}
        with:
        with: {fetch-depth: 0}
          python-version: "3.12"
        with: {fetch-depth: 0}
      - run: pip install pytest==9.1.1
        with: {fetch-depth: 0}
      - run: python -m pytest -q tests
        with: {fetch-depth: 0}
  old-links:
        with: {fetch-depth: 0}
    needs: changes
        with: {fetch-depth: 0}
    if: needs.changes.outputs.oldlinks == '1'
        with: {fetch-depth: 0}
    # Dean 25 Oct 2026 (permanent): every link ever sent out, plus app-added forms (?igsh/?utm/?fbclid, hashes, old paths),
        with: {fetch-depth: 0}
    # opened with an OLD service worker installed and the Instagram in-app UA, must show the map and listings.
        with: {fetch-depth: 0}
    runs-on: ubuntu-latest
        with: {fetch-depth: 0}
    timeout-minutes: 40
        with: {fetch-depth: 0}
    steps:
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
        with: {fetch-depth: 0}
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {fetch-depth: 0}
        with: {python-version: "3.12"}
        with: {fetch-depth: 0}
      - run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/old_links.py
        with: {fetch-depth: 0}
  journeys:
        with: {fetch-depth: 0}
    needs: changes
        with: {fetch-depth: 0}
    if: needs.changes.outputs.journeys == '1'
        with: {fetch-depth: 0}
    # Dean 25 Oct 2026 (permanent rule): the real-click user-journey suite must pass before any site change merges
        with: {fetch-depth: 0}
    # (all three types, 390/1366 px, light/dark). Runs on every push / PR that touches site html/css/js.
        with: {fetch-depth: 0}
    runs-on: ubuntu-latest
        with: {fetch-depth: 0}
    timeout-minutes: 60
        with: {fetch-depth: 0}
    steps:
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
        with: {fetch-depth: 2}
        with: {fetch-depth: 0}
      - id: site
        with: {fetch-depth: 0}
        run: |
        with: {fetch-depth: 0}
          base=${{ github.event.pull_request.base.sha || github.event.before }}
        with: {fetch-depth: 0}
          if git diff --name-only "$base" HEAD 2>/dev/null | grep -Eq '\.(html|css|js)$|^scripts/journeys\.py$|^scripts/check_browser\.py$'; then echo run=1 >> "$GITHUB_OUTPUT"; else echo run=0 >> "$GITHUB_OUTPUT"; fi
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {fetch-depth: 0}
        if: steps.site.outputs.run == '1'
        with: {fetch-depth: 0}
        with: {python-version: "3.12"}
        with: {fetch-depth: 0}
      - if: steps.site.outputs.run == '1'
        with: {fetch-depth: 0}
        run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/journeys.py
        with: {fetch-depth: 0}
  browser-tests:
        with: {fetch-depth: 0}
    needs: changes
        with: {fetch-depth: 0}
    if: needs.changes.outputs.browser == '1'
        with: {fetch-depth: 0}
    # Dean 25 Oct 2026: browser tests (status line never cut off, list panel alignment, open-today, two-finger note, ...)
        with: {fetch-depth: 0}
    # really run here; the plain test job has no Playwright so it skips them.
        with: {fetch-depth: 0}
    runs-on: ubuntu-latest
        with: {fetch-depth: 0}
    timeout-minutes: 40
        with: {fetch-depth: 0}
    steps:
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {fetch-depth: 0}
        with: {python-version: "3.12"}
        with: {fetch-depth: 0}
      - run: pip install -q pytest==9.1.1 playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null
        with: {fetch-depth: 0}
      - run: test -x /usr/bin/google-chrome && python -m pytest -q tests -rs
        with: {fetch-depth: 0}
  design-lock:
        with: {fetch-depth: 0}
    needs: changes
        with: {fetch-depth: 0}
    if: needs.changes.outputs.design == '1'
        with: {fetch-depth: 0}
    # Dean 25 Oct 2026 (permanent): card design lock - call/directions/share/FB/links/report/dots/badges/tap targets,
        with: {fetch-depth: 0}
    # list cards and pin pop-ups, all 3 types, 390/1366, light/dark.
        with: {fetch-depth: 0}
    runs-on: ubuntu-latest
        with: {fetch-depth: 0}
    timeout-minutes: 40
        with: {fetch-depth: 0}
    steps:
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {fetch-depth: 0}
        with: {python-version: "3.12"}
        with: {fetch-depth: 0}
      - run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/design_lock.py
        with: {fetch-depth: 0}
