name: Patch shelter cards (scoped, no fetch)
# Rebuilds ONLY the named cards inside the published shelters.js from the hand files, then runs the same
# gates as a refresh on the whole file. Publishes (commits) only on main and only when publish is true.
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated card ids (must already be on the map), e.g. man-ss-x,man-ss-y"
        required: true
      publish:
        description: "Commit to main when every gate passes (true/false)"
        required: true
        default: "false"
permissions:
  contents: write
concurrency:
  group: refresh-shelters
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lock and patch tests
        run: python -m pytest -q tests/test_place_lock.py tests/test_place_lock_hand_wins.py tests/test_final_lock.py tests/test_patch_cards.py tests/test_hand_values_survive_two_refreshes.py
      - name: Patch the named cards (no fetch)
        run: python scripts/patch_cards.py "${{ inputs.ids }}"
      - name: Every entry has a phone or a labelled council fallback
        run: python scripts/shelter_contacts.py check
      - name: Publish gate check (phone + who it's for, 0 gaps)
        env:
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: python scripts/publish_gate.py check
      - name: No-pin rule (no postcode/lat/lng on no_pin cards)
        run: |
          python - <<'PY'
          import json,sys
          t=open("shelters.js",encoding="utf-8").read(); d=json.loads(t[t.index("=")+1:].strip().rstrip(";"))
          bad=[x["id"] for x in d["items"] if x.get("no_pin") and any(k in x for k in ("postcode","lat","lng"))]
          print("no_pin with pin fields:", bad); sys.exit(1 if bad else 0)
          PY
      - name: Refresh guard - nothing dropped (place, phone, times)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh_guard.py shelters
      - name: Severe-failure gate - file parses, no count drop
        env:
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: python scripts/validate.py gate
      - name: Whole-file sense check (all cards)
        run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/sense_check.py
      - name: Stamp
        if: inputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: python scripts/stamp.py write shelters && python scripts/stamp.py verify
      - name: Commit (main + publish only)
        if: inputs.publish == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/git_add_existing.sh shelters.js stamp.js reports/refresh_guard_shelters.md logs/refresh_guard.json logs/sense_check.json reports/sense_check.md
          git diff --cached --quiet && { echo "No change"; exit 0; }
          git commit -m "Scoped card patch: ${{ inputs.ids }}"
          git pull --rebase --autostash && git push
      - name: Keep the patched file (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patched-shelters-${{ github.run_id }}
          path: shelters.js
