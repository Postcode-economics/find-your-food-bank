name: Refresh food bank data
on:
  schedule:
    - cron: "29 4,12,20 * * *"   # three runs a day (UTC): Give Food + IFAN discovery + own locations pages (overrides/own_location_pages.json), own-site closure + times check
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # failed or partial runs open a 'refresh-alert' issue (scripts/alert.py)
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the checks
        run: python -m unittest discover -s tests -v
      - name: Rebuild data.js (discovery + own-site checks)
        run: python scripts/build.py
      - name: Refuse to publish without fresh verification
        run: python scripts/verify_fresh.py foodbanks
      - name: Full check of every food bank's own site (access flips, hours, closures, contacts, items needed -> reports/daily_review.md)
        id: full
        continue-on-error: true   # the run still publishes the fresh discovery data, but a failure is now alerted below
        run: python scripts/full_check.py
      - name: Write compact browser data.js from data.full.js
        run: python scripts/compact.py
      - name: Rebuild area pages, sitemap.xml and robots.txt for Google (scripts/build_seo.py)
        id: seo
        continue-on-error: true   # never blocks the data publish; alerted below
        run: python scripts/build_seo.py
      - name: Stamp this run's UK date and time (footer last updated / checked)
        run: python scripts/stamp.py write refresh && python scripts/stamp.py verify
      - name: Page dates - WebPage/Dataset/FAQ JSON-LD dateModified, home 'Updated' line, sitemap.xml lastmod (fail-safe)
        continue-on-error: true
        run: python scripts/seo_meta.py
      - name: Commit if changed
        run: |
          python scripts/stamp.py verify
          git add stamp.js index.html faq.html terms.html privacy.html accessibility.html food-banks warm-spaces sitemap.xml logs/discovery_today_foodbanks.json reports/new_today.md reports/manual_review.md stamp.js data.js data.full.js access.js logs/foodbank_audit.csv logs/foodbank_closed.json logs/foodbank_discovery.json logs/foodbank_times_check.json logs/foodbank_recheck.json logs/foodbank_pending.json overrides/foodbank_own_pages.json reports/ overrides/foodbank_closed.json food-banks warm-spaces sitemap.xml robots.txt 404.html overrides/district_cache.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "3x-daily food bank refresh $(date -u +%F)"
          # data.js / access.js / logs / reports are generated: if another push touched them meanwhile, keep this run's
          # fresh build (overrides are re-applied on every run, so nothing hand-made is lost for more than one run)
          for n in 1 2 3; do
            ok=0
            if git pull --rebase -X theirs; then ok=1
            else
              # conflicts -X theirs can't settle (e.g. an area page deleted by one run, rewritten by another): keep this run's version
              for f in $(git diff --name-only --diff-filter=U); do
                if git cat-file -e ":3:$f" 2>/dev/null; then git checkout --theirs -- "$f" && git add -- "$f"; else git rm -q -- "$f"; fi
              done
              GIT_EDITOR=true git rebase --continue && ok=1
            fi
            if [ $ok = 1 ]; then python scripts/discovery_rules.py render || true; git add reports/new_today.md reports/manual_review.md; git diff --cached --quiet || git commit -m "Discovery reports re-rendered after merge"; if git push; then exit 0; fi; fi
            git rebase --abort 2>/dev/null || true; sleep $((n * 10))
          done
          exit 1
      - name: Alert - run failed (nothing new published)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py open foodbanks "Food bank refresh run failed" "A step failed, so this run did not publish. Earlier data stays live. Open the run log to see which step."
      - name: Alert - full own-site check failed (published without it)
        if: always() && steps.full.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py open full-check "Food bank full own-site check failed" "full_check.py failed, so this run published without the own-site checks (hours, closures, access flips). reports/daily_review.md was not refreshed."
      - name: Clear the full-check alert after a good check
        if: success() && steps.full.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve full-check
      - name: Clear the run alert after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve foodbanks
      - name: Alert - area pages / sitemap build failed (data still published)
        if: always() && steps.seo.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py open seo "Area pages build failed" "build_seo.py failed, so the /food-banks/ and /warm-spaces/ pages and sitemap.xml were not refreshed this run. The map itself is unaffected."
      - name: Clear the area pages alert after a good build
        if: success() && steps.seo.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve seo
