name: Refresh food bank data
on:
  schedule:
    - cron: "29 4,12,20 * * *"   # three runs a day (UTC): Give Food + IFAN discovery + own locations pages (overrides/own_location_pages.json), own-site closure + times check
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # failed or partial runs open a 'refresh-alert' issue (scripts/alert.py)
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the checks
        run: python -m unittest discover -s tests -v
      - name: Rebuild data.js (discovery + own-site checks)
        run: python scripts/build.py
      - name: Refuse to publish without fresh verification
        run: python scripts/verify_fresh.py foodbanks
      - name: Full check of every food bank's own site (access flips, hours, closures, contacts, items needed -> reports/daily_review.md)
        id: full
        continue-on-error: true   # the run still publishes the fresh discovery data, but a failure is now alerted below
        run: python scripts/full_check.py
      - name: Write compact browser data.js from data.full.js
        run: python scripts/compact.py
      - name: Stamp this run's UK date and time (footer last updated / checked)
        run: python scripts/stamp.py write refresh && python scripts/stamp.py verify
      - name: Commit if changed
        run: |
          python scripts/stamp.py verify
          git add stamp.js data.js data.full.js access.js logs/foodbank_audit.csv logs/foodbank_closed.json logs/foodbank_discovery.json logs/foodbank_times_check.json logs/foodbank_recheck.json logs/foodbank_pending.json overrides/foodbank_own_pages.json reports/ overrides/foodbank_closed.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "3x-daily food bank refresh $(date -u +%F)"
          # data.js / access.js / logs / reports are generated: if another push touched them meanwhile, keep this run's
          # fresh build (overrides are re-applied on every run, so nothing hand-made is lost for more than one run)
          for n in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((n * 10))
          done
          exit 1
      - name: Alert - run failed (nothing new published)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py open foodbanks "Food bank refresh run failed" "A step failed, so this run did not publish. Earlier data stays live. Open the run log to see which step."
      - name: Alert - full own-site check failed (published without it)
        if: always() && steps.full.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py open full-check "Food bank full own-site check failed" "full_check.py failed, so this run published without the own-site checks (hours, closures, access flips). reports/daily_review.md was not refreshed."
      - name: Clear the full-check alert after a good check
        if: success() && steps.full.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve full-check
      - name: Clear the run alert after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve foodbanks
