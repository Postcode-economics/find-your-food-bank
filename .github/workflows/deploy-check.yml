# Dean 25 Oct 2026 (permanent rule): after every deploy of a site change, open every link ever sent out (old service worker
# installed first, Instagram in-app UA) against the LIVE site. On failure the deploying commit is reverted and an alert opened.
# Also runs daily at 06:15 UTC (alert only). Runs the old-links check and the click-through journey suite.
name: Deploy check (live old links + user journeys + card design lock)
on:
  push:
    branches: [main]
    paths: ['**.html', '**.css', '**.js', 'scripts/old_links.py', 'scripts/old_links.json', 'scripts/journeys.py', 'scripts/design_lock.py', 'scripts/design_lock.json']
  schedule: [{cron: "15 6 * * *"}]
  workflow_dispatch:
permissions: {contents: write, issues: write}
concurrency: {group: deploy-check, cancel-in-progress: false}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Wait for the deploy (live version.json = this commit's build)
        run: |
          want=$(python -c "import json;print(json.load(open('version.json'))['build'])")
          got=""
          for i in $(seq 1 40); do
            got=$(curl -fsS -A "Mozilla/5.0 helpmap-check" "https://helpmap.uk/version.json?t=$RANDOM" 2>/dev/null | python -c "import json,sys;print(json.load(sys.stdin).get('build',''))" 2>/dev/null || true)
            if [ "$got" = "$want" ]; then echo "live is $got"; exit 0; fi
            sleep 15
          done
          # 25 Oct 20:23: a run for an older commit tested the NEWER live build, "failed" on the build name and tried to revert. If main
          # has moved past this commit, a newer run checks the live site - this one stands down (no checks, never a revert).
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "${{ github.sha }}" ]; then echo "::notice::superseded by a newer main commit; live is '$got'"; echo "SUPERSEDED=1" >> "$GITHUB_ENV"; exit 0; fi
          echo "::warning::live build '$got' != '$want' after 10 min; testing anyway"
      - if: env.SUPERSEDED != '1'
        run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/old_links.py https://helpmap.uk && python scripts/journeys.py https://helpmap.uk && python scripts/design_lock.py https://helpmap.uk && python scripts/dark_default.py https://helpmap.uk
      - name: Revert the deploying commit (push only) and alert
        if: failure() && github.event_name == 'push'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          case "${{ github.sha }}" in ad54c561*) echo "::error::v88 (ad54c56) is never auto-reverted (Dean 25 Oct 18:56) - fix forward"; python scripts/alert.py open old-links "Live check failed on v88 - NOT reverted (Dean's rule), fix forward" "See run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; exit 0;; esac
          set -euo pipefail   # 25 Oct: '&&' chains hid a failed pull (test logs left the tree dirty) and the step still passed
          git config user.name "helpmap-bot"; git config user.email "hello@helpmap.uk"
          git reset -q --hard && git clean -fdq   # drop logs/reports the checks wrote
          git pull --rebase origin main
          bash scripts/revert_site.sh ${{ github.sha }}
          git push origin HEAD:main
          git log -1 --format=%s | grep -q "^Auto-revert" || { echo "::error::revert commit not created"; exit 1; }
          python scripts/alert.py open old-links "Live old-links check failed - deploy reverted" "Commit ${{ github.sha }} failed; see run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Alert (daily check)
        if: failure() && github.event_name != 'push'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python scripts/alert.py open old-links "Daily live old-links check failed" "See run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - if: success() && env.SUPERSEDED != '1'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python scripts/alert.py resolve old-links
