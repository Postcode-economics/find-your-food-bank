name: Incident rest centre watch (every 10 min)
# Reads Met Office, Environment Agency, SEPA, Natural Resources Wales and UK Emergency Alerts.
# Amber, red, or a severe flood warning (level red on those feeds) re-scans only that council's
# rest centre pages. No warning and no open rest centre: no council pages are fetched.
# Publishes only when the live file or switch-on state changes. One open alert issue if a check errors.
# GitHub's scheduler often starts only a few dozen of a */10 cron (28 runs in one day). This job
# repeats the check every 10 minutes until near the 6-hour limit, then starts the next run itself.
# The cron is the backup if that chain has stopped. One run at a time, so a queued cron does not
# double-fetch. A push of these scheduling files starts the chain; later data commits do not.
#
# State under logs/ stays out of this public repo (rule 97). Actions cache/artifacts are NOT used
# (a public repo's cache can be read from fork PRs; artifacts are downloadable). On each job start
# the watch rebuilds live state from the already-public incident_rest_centre_live.json when the
# gitignored logs are empty, so an open rest centre is still re-scanned and expired across restarts.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      max_checks:
        description: "Practice: stop after N checks (leave blank for the full 6-hour loop)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - .github/workflows/incident-rest-centre-watch.yml
      - scripts/incident_rest_centre_watch_loop.sh
      - scripts/incident_rest_centre_schedule.py
      - scripts/incident_rest_centre_live.py
      - scripts/incident_rest_centre_watch.py
permissions:
  contents: write
  issues: write
  actions: write   # gh workflow run, to start the next loop
concurrency:
  # Per ref so a practice run on a branch cannot block the live main chain.
  group: incident-rest-centre-watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Incident rest centre watch
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          NRW_FLOOD_API_KEY: ${{ secrets.NRW_FLOOD_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          INCIDENT_WATCH_MAX_RUNS: ${{ github.event.inputs.max_checks }}
        run: bash scripts/incident_rest_centre_watch_loop.sh
      - name: Start the next check before this job hits the 6-hour limit
        # Practice (max_checks set) must not chain. Non-main must not restart the live chain.
        if: ${{ always() && (steps.watch.outcome == 'success' || steps.watch.outcome == 'failure') && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.event.inputs.max_checks == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          stamp="${RUNNER_TEMP}/incident-watch-start"
          if [ -f "$stamp" ]; then start=$(cat "$stamp"); else start=$(date +%s); fi
          elapsed=$(( $(date +%s) - start ))
          if [ "$elapsed" -lt 0 ]; then elapsed=0; fi
          wait=$(python scripts/incident_rest_centre_schedule.py wait "$elapsed")
          ref="${GITHUB_REF_NAME}"
          requested=0
          for n in 1 2 3 4 5; do
            if gh workflow run incident-rest-centre-watch.yml --ref "$ref"; then
              echo "Next incident rest centre watch requested on ${ref}"
              requested=1
              break
            fi
            echo "::warning::could not request the next run (try ${n})"
            sleep $((n * 5))
          done
          if [ "$requested" -ne 1 ]; then
            echo "::error::could not start the next incident rest centre watch"
            exit 1
          fi
          # The queued run cannot start until this job leaves the concurrency group.
          echo "Last check started ${elapsed}s ago; holding ${wait}s so the next one is about 10 minutes after it"
          sleep "$wait"
