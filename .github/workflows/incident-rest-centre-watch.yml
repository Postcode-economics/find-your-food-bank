name: Incident rest centre watch (every 10 min)
# Reads Met Office, Environment Agency, SEPA, Natural Resources Wales and UK Emergency Alerts.
# Amber, red, or a severe flood warning (level red on those feeds) re-scans only that council's
# rest centre pages. No warning and no open rest centre: no council pages are fetched.
# Publishes only when the live file or switch-on state changes. One open alert issue if the run errors.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: incident-rest-centre-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Incident rest centre watch
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          NRW_FLOOD_API_KEY: ${{ secrets.NRW_FLOOD_API_KEY }}
        run: python scripts/incident_rest_centre_watch.py
      - name: Commit and deploy only if the live file or state changed
        if: steps.watch.outcome == 'success'
        run: |
          bash scripts/git_add_existing.sh incident_rest_centre_live.json incident_rest_centre_live.js logs/incident_rest_centre_live_state.json logs/incident_rest_centre_switch_state.json logs/incident_rest_centre_pages.json reports/pending_dean.md
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Incident rest centre watch $(date -u +%F-%H%M)"
          in_rebase() { [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; }
          for n in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            if in_rebase && { bash scripts/refresh_rebase_conflicts.sh; GIT_EDITOR=true git rebase --continue; } && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((n * 5))
          done
          echo "::error::incident rest centre watch could not be pushed"
          exit 1
      - name: Alert - incident rest centre watch failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::error::Incident rest centre watch failed"
          python scripts/alert.py open incident-watch "Incident rest centre watch failed" "The 10-minute rest centre (council-run) watch did not finish. Open the run log. A later successful run closes this issue."
      - name: Clear the watch alert after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve incident-watch
