name: Watchdog - alert if nothing has been published for 10 hours
on:
  schedule:
    - cron: "17 * * * *"   # hourly
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the age of the last published run (stamp.js)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py stale 10
