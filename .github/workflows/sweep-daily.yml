name: Daily deep sweep (councils + voluntary-sector lists)
# Discovery only. Runs three times a day (03:05, 11:05, 19:05 UTC), ~85 min before each 3x-daily refresh,
# so new shelters/warm spaces, start dates, SWEP pages and found opening times reach the next refresh.
# Independent of the 3x-daily refresh workflows, which still re-check every entry against its source.
on:
  schedule:
    - cron: "5 3,11,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # failed or partial runs open a 'refresh-alert' issue (scripts/alert.py)
concurrency:
  group: sweep-daily
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the sweep and verification checks
        run: python -m unittest tests.test_sweep tests.test_recheck tests.test_rule21_refresh -v
      - name: Sweep every council sitemap and list page (fail-safe; adds new entries only)
        run: python scripts/sweep_daily.py
      - name: Find council SWEP / rough sleeping pages (adds to overrides/swep_sources.json; fail-safe)
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/swep.py discover
      - name: Headless Chromium for JavaScript-drawn Trussell centre cards (fail-safe)
        continue-on-error: true
        run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      # Dean 28 Oct 2026: food bank times update automatically. Only address and phone changes wait for him.
      - name: Find missing food bank opening times and auto-apply the clean ones under the strict times rules (own site, postcode on the page, one weekly block, day and times on the same line, identical on 2 runs, no conflicting source, never known -> closed/empty, not undone; logged with undo in reports/times_auto_applied.json; everything else -> reports/pending_dean.md; fail-safe)
        continue-on-error: true
        timeout-minutes: 35
        run: python scripts/times_finder.py --render
      - name: Stamp this run's UK date and time (footer last updated / checked)
        run: python scripts/stamp.py write sweep && python scripts/stamp.py verify
      - name: Page dates - WebPage/Dataset/FAQ JSON-LD dateModified, home 'Updated' line, sitemap.xml lastmod (fail-safe)
        continue-on-error: true
        run: python scripts/seo_meta.py
      # Nothing is pushed unless this run's files pass the same suite as the CI 'test' job and the publish validator.
      # A clean venv without Playwright, so the browser checks skip exactly as in that job.
      - name: Full test suite on this run's files (a failure stops the push)
        timeout-minutes: 25
        run: |
          python -m venv /tmp/suite && /tmp/suite/bin/pip install -q pytest==9.1.1
          /tmp/suite/bin/python -m pytest -q tests
      - name: Validate before publishing (a failure stops the push)
        run: python scripts/validate.py gate
      - name: Commit new entries and the sweep log
        id: commit
        run: |
          python scripts/stamp.py verify
          bash scripts/git_add_existing.sh stamp.js index.html version.json faq.html terms.html privacy.html accessibility.html food-banks warm-spaces shelters sitemap.xml robots.txt 404.html overrides/page_dates.json logs/discovery_today_sweep.json reports/new_today.md reports/manual_review.md stamp.js overrides/swep_sources.json overrides/opening_times.json logs/times_finder.json logs/times_finder_seen.json reports/times_auto_applied.json reports/pending_dean.md overrides/shelters_manual.json overrides/shelters_verified.json overrides/shelters_unverified.json reports/learning_state.json \
                  overrides/warmspaces_manual.json overrides/warmspaces_verified.json overrides/warmspaces_unverified.json \
                  logs/sweep_log.json logs/sweep_pending.json overrides/foodbank_own_pages.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily deep sweep $(date -u +%F)"
          # Guard (27 Oct 21:06 run 40583907794): a tracked file a step rewrote but the add list missed left the tree dirty,
          # so 'git pull --rebase' refused 3 times. Print it, then stash it so the pull can run; --autostash covers later rebuilds.
          in_rebase() { [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; }
          git status
          # Untracked too: a file this run wrote but did not add, which another run has since committed, makes the pull
          # refuse with "untracked working tree files would be overwritten" before any rebase starts.
          left=$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } )
          if [ -n "$left" ]; then
            echo "::warning::files modified or new but not in the add list (stashed, not published): $(echo $left)"
            git stash push --include-untracked --quiet -m "refresh-leftovers" || true
          fi
          for n in 1 2 3; do
            if git pull --rebase --autostash; then
              python scripts/discovery_rules.py render || true
              { python scripts/build_seo.py && python scripts/seo_meta.py; } || echo "::warning::page rebuild after merge failed"
              git add -A food-banks warm-spaces shelters sitemap.xml robots.txt 404.html overrides/page_dates.json index.html version.json faq.html terms.html privacy.html accessibility.html overrides/district_cache.json
              git add reports/new_today.md reports/manual_review.md
              git diff --cached --quiet || git commit -m "Reports and area pages rebuilt after merge"
              if git push; then exit 0; fi
            else
              # conflicts -X theirs can't settle (e.g. an area page deleted by one run, rewritten by another): keep this run's version
              if in_rebase && { bash scripts/refresh_rebase_conflicts.sh; GIT_EDITOR=true git rebase --continue; }; then
                python scripts/discovery_rules.py render || true
              { python scripts/build_seo.py && python scripts/seo_meta.py; } || echo "::warning::page rebuild after merge failed"
              git add -A food-banks warm-spaces shelters sitemap.xml robots.txt 404.html overrides/page_dates.json index.html version.json faq.html terms.html privacy.html accessibility.html overrides/district_cache.json
                git add reports/new_today.md reports/manual_review.md
                git diff --cached --quiet || git commit -m "Reports and area pages rebuilt after merge"
                if git push; then exit 0; fi
              else echo "::warning::rebase did not complete (conflict or no rebase in progress)"; git status; git rebase --abort 2>/dev/null || true; fi
            fi
            sleep $((n * 10))
          done
          exit 1
      - name: IndexNow - tell search engines which pages really changed (fail-safe)
        continue-on-error: true
        run: python scripts/indexnow.py "$GITHUB_SHA"
      - name: Findings report email (fail-safe)
        if: always() && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/findings_report.py sweep || true
      - name: Alert - run failed (nothing new published)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py open sweep "Overnight sweep run failed" "A step failed, so this run did not publish. Earlier data stays live. Open the run log to see which step."
      - name: Clear the run alert after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/alert.py resolve sweep
