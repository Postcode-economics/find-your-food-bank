        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/new_live_email.py --layers shelters --baseline "$LIVE_BASELINE" --send || true
      - name: New place email practice echo
        if: always() && github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: Brevo skipped'"
      - name: Practice-run guard
        if: always() && github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::Practice run failed: unstaged changes in the worktree."
            git diff --stat
            exit 1
          fi
          if ! git diff --cached --quiet; then
            echo "::error::Practice run failed: staged changes detected."
            git diff --cached --stat
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Practice run failed: dirty worktree."
            git status --porcelain
            exit 1
          fi
          current_sha=$(git rev-parse HEAD)
          if [ "$current_sha" != "$LIVE_BASELINE" ]; then
            echo "::error::Practice run failed: HEAD ($current_sha) differs from LIVE_BASELINE ($LIVE_BASELINE)."
            exit 1
          fi
          echo "Practice run guard passed: nothing staged, worktree clean, and HEAD matches baseline."

  publish_warmspaces:
    needs: detect
    if: needs.detect.outputs.run_warmspaces == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'refresh-warmspaces' || format('refresh-warmspaces-pr-{0}', github.ref_name) }}
