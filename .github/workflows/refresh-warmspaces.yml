name: Refresh Warm spaces layer
on:
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-warmspaces
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild warmspaces.js
        run: python scripts/build_warmspaces.py
      - name: Commit if changed
        run: |
          git add warmspaces.js logs/warmspaces_log.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily Warm spaces refresh $(date -u +%F)"
          git pull --rebase && git push
