name: Refresh Warm spaces layer
on:
  schedule:
    - cron: "53 4,12,20 * * *"   # three runs a day (UTC); every run re-fetches every evidence page
  workflow_dispatch:
permissions:
  contents: write
  issues: write   # failed or partial runs open a 'refresh-alert' issue (scripts/alert.py)
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'refresh-warmspaces' || format('refresh-warmspaces-pr-{0}', github.ref_name) }}
  cancel-in-progress: false
env:
  HELPMAP_STATE_CHECK: "1"   # times auto-apply only after saved run state is restored (scripts/auto_rules.py state_ok, #491)
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restore saved run state from the private vault (logs/ and reports/; never stored in this public repo)
        continue-on-error: true
        timeout-minutes: 5
        env:
          HELPMAP_STATE_KEY: ${{ secrets.HELPMAP_STATE_KEY }}
        run: bash scripts/private_state.sh restore
      - name: Remember the published map
        run: echo "LIVE_BASELINE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the verification checks
        env:
          HELPMAP_STATE_CHECK: "0"   # the test suite itself must not depend on run state (#491)
          HELPMAP_UNDO_BASELINE: ""        # nor on this run's start-of-run undo log: tests that run full_check.main()
          HELPMAP_UNDO_BASELINE_ROOT: ""   # would count this run's real refresh-gate times (practice 42813119765)
        run: python -m unittest discover -s tests -v
      - name: Rebuild warmspaces.js (re-fetches and re-checks every source page)
        run: python scripts/build_warmspaces.py
        env:
          WW_DISCOVERY_BUDGET: "0"     # 0 = the whole Warm Welcome feed, time-boxed by WW_DISCOVERY_SECONDS
          WW_DISCOVERY_SECONDS: "1200"
          HELPMAP_SHADOW_TRIAL: "1"   # two-week shadow trial of Phase 2 rules: record only, private reports/shadow/ (scripts/shadow_trial.py)
      - name: Refuse to publish without fresh verification
        run: python scripts/verify_fresh.py warmspaces
      - name: Publish gate - new places need a verified phone (shelters also who it's for); held ones go to reports/pending_dean.md
        env:
          # Rule 9. Repository secret, one address or phone per line. See scripts/private_block.py.
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: python scripts/publish_gate.py warmspaces
      - name: CI check - published shelters have phone + who it's for, warm spaces a phone (known gaps listed); food banks report-only
        env:
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: python scripts/publish_gate.py check
      - name: Refresh guard - keep any place, phone or opening times this run would drop (report + alert, scripts/refresh_guard.py)
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: python scripts/refresh_guard.py warmspaces
      - name: Does the result make sense? (real searches on all three types; failure stops publishing, scripts/sense_check.py)
        run: pip install -q playwright==1.47.0 && python -m playwright install --with-deps chromium >/dev/null && python scripts/sense_check.py
      - name: Review list for Dean (adds, removals, tier flips, opens-later)
        continue-on-error: true
        run: python scripts/layer_review.py
      - name: Rebuild area pages, sitemap.xml and robots.txt for Google (scripts/build_seo.py)
        id: seo
        continue-on-error: true   # never blocks the data publish; alerted below
        run: python scripts/build_seo.py
      - name: Stamp this run's UK date and time (map 'Updated today at' line)
        run: python scripts/stamp.py write warmspaces && python scripts/stamp.py verify
      - name: Page dates - WebPage/Dataset/FAQ JSON-LD dateModified, home 'Updated' line, sitemap.xml lastmod (fail-safe)
        continue-on-error: true
        run: python scripts/seo_meta.py
      - name: Every entry has a phone or a labelled council fallback (overrides/*_contacts.json)
        run: python scripts/shelter_contacts.py check
      - name: Severe-failure gate (point 33) - stop publishing if a data file won't parse or a count fell >10% vs last published
        env:
          PRIVATE_BLOCKLIST: ${{ secrets.PRIVATE_BLOCKLIST }}
        run: python scripts/validate.py gate
      - name: City coverage report and alert (does not fail the run)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: python scripts/city_watch.py || true
      - name: City coverage practice echo
        if: github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: issues skipped'"
      # The checks above ran on the published files. Run the same set again on this run's rebuilt files, so a
      # rebuild that breaks a lock or verification test is never committed (earlier data stays live, the run-failed
      # alert fires). A clean venv without Playwright, so browser checks skip exactly as in the first run.
      - name: Test the same checks again on this run's rebuilt files (a failure stops the publish)
        env:
          HELPMAP_STATE_CHECK: "0"   # the test suite itself must not depend on run state (#491)
          HELPMAP_UNDO_BASELINE: ""        # nor on this run's start-of-run undo log: tests that run full_check.main()
          HELPMAP_UNDO_BASELINE_ROOT: ""   # would count this run's real refresh-gate times (practice 42813119765)
        timeout-minutes: 15
        run: python -m venv /tmp/postcheck && /tmp/postcheck/bin/python -m unittest discover -s tests -v
      - name: Commit if changed
        id: commit
        if: github.ref == 'refs/heads/main'
        run: |
          bash scripts/git_add_existing.sh stamp.js index.html version.json faq.html terms.html privacy.html accessibility.html food-banks warm-spaces shelters sitemap.xml robots.txt 404.html overrides/page_dates.json logs/discovery_today_warmspaces.json reports/new_today.md reports/manual_review.md warmspaces.js logs/warmspaces_discovery.json logs/warmspaces_times_check.json logs/times_crosscheck_seen.json reports/times_auto_applied.json logs/warmspaces_log.json logs/warmspaces_pending.json logs/warmspaces_held.json logs/warmspaces_recheck.json logs/warmspaces_last_confirmed.json reports/warmspaces_grace.md logs/warmspaces_ww_discovery.json logs/warmspaces_ww_discovery_run.json reports/layers_review.md reports/layers_review.json food-banks warm-spaces sitemap.xml robots.txt 404.html overrides/district_cache.json logs/refresh_guard.json reports/refresh_guard_warmspaces.md logs/warmspaces_carry_forward.json reports/warmspaces_carry_forward.md logs/warmspaces_area_carry_forward.json logs/pending_dean.json reports/pending_dean.md logs/sense_check.json reports/sense_check.md reports/verified_new_places.json reports/city_coverage.md
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "3x-daily Warm spaces refresh $(date -u +%F)"
          # Guard (27 Oct 21:06 run 40583907794): a tracked file a step rewrote but the add list missed left the tree dirty,
          # so 'git pull --rebase' refused 3 times. Print it, then stash it so the pull can run; --autostash covers later rebuilds.
          in_rebase() { [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; }
          git status
          # Untracked too: a file this run wrote but did not add, which another run has since committed, makes the pull
          # refuse with "untracked working tree files would be overwritten" before any rebase starts.
          left=$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } )
          if [ -n "$left" ]; then
            echo "::warning::files modified or new but not in the add list (stashed, not published): $(echo $left)"
            git stash push --include-untracked --quiet -m "refresh-leftovers" || true
          fi
          # shared reports (new_today / manual_review / layers_review) may have been changed by another refresh meanwhile:
          # keep this run's files, then rebuild the discovery reports from every layer's log so nobody's entries are lost
          for n in 1 2 3; do
            if git pull --rebase --autostash; then
              python scripts/discovery_rules.py render || true
              { python scripts/build_seo.py && python scripts/seo_meta.py; } || echo "::warning::page rebuild after merge failed"
              git add -A food-banks warm-spaces shelters sitemap.xml robots.txt 404.html overrides/page_dates.json index.html version.json faq.html terms.html privacy.html accessibility.html overrides/district_cache.json
              bash scripts/git_add_existing.sh reports/new_today.md reports/manual_review.md
              git diff --cached --quiet || git commit -m "Reports and area pages rebuilt after merge"
              if git push; then exit 0; fi
            else
              # conflicts -X theirs can't settle (e.g. an area page deleted by one run, rewritten by another): keep this run's version
              if in_rebase && { bash scripts/refresh_rebase_conflicts.sh; GIT_EDITOR=true git rebase --continue; }; then
                python scripts/discovery_rules.py render || true
              { python scripts/build_seo.py && python scripts/seo_meta.py; } || echo "::warning::page rebuild after merge failed"
              git add -A food-banks warm-spaces shelters sitemap.xml robots.txt 404.html overrides/page_dates.json index.html version.json faq.html terms.html privacy.html accessibility.html overrides/district_cache.json
                bash scripts/git_add_existing.sh reports/new_today.md reports/manual_review.md
                git diff --cached --quiet || git commit -m "Reports and area pages rebuilt after merge"
                if git push; then exit 0; fi
              else echo "::warning::rebase did not complete (conflict or no rebase in progress)"; git status; git rebase --abort 2>/dev/null || true; fi
            fi
            sleep $((n * 10))
          done
          exit 1
      - name: IndexNow - tell search engines which pages really changed (fail-safe)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: python scripts/indexnow.py "$GITHUB_SHA"
      - name: IndexNow practice echo
        if: github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: IndexNow skipped'"
      - name: Findings report email (fail-safe)
        if: always() && steps.commit.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: python scripts/findings_report.py warmspaces || true
      - name: Findings report email practice echo
        if: always() && github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: Brevo skipped'"
      - name: New place email (fail-safe)
        if: always() && steps.commit.outcome == 'success' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python scripts/new_live_email.py --layers warmspaces --baseline "$LIVE_BASELINE" --send || true
      - name: New place email practice echo
        if: always() && github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: Brevo skipped'"
      - name: Alert - run failed (nothing new published)
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: python scripts/alert.py open warmspaces "Warm spaces refresh run failed" "A step failed, so this run did not publish. Earlier data stays live. Open the run log to see which step."
      - name: Alert - run failed practice echo
        if: failure() && github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: issues skipped'"
      - name: Clear the run alert after a good run
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: python scripts/alert.py resolve warmspaces
      - name: Clear the run alert practice echo
        if: success() && github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: issues skipped'"
      - name: Alert - area pages / sitemap build failed (data still published)
        if: always() && steps.seo.outcome == 'failure' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: python scripts/alert.py open seo-warmspaces "Area pages build failed (warm spaces refresh)" "build_seo.py failed, so the /food-banks/ and /warm-spaces/ pages and sitemap.xml were not refreshed this run. The map itself is unaffected."
      - name: Alert - area pages / sitemap build failed practice echo
        if: always() && (steps.seo.outcome == 'failure') && github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: issues skipped'"
      - name: Clear the area pages alert after a good build
        if: success() && steps.seo.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/main' && github.token || '' }}
        run: python scripts/alert.py resolve seo-warmspaces
      - name: Clear the area pages alert practice echo
        if: success() && (steps.seo.outcome == 'success') && github.ref != 'refs/heads/main'
        run: "echo 'PRACTICE: issues skipped'"
      - name: Save this run's state to the private vault (main only; never in this public repo)
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 5
        env:
          HELPMAP_STATE_KEY: ${{ secrets.HELPMAP_STATE_KEY }}
        run: bash scripts/private_state.sh save warmspaces
      - name: Practice-run guard
        if: always() && github.ref != 'refs/heads/main'
        run: |
          if ! git diff --cached --quiet; then
            echo "::error::Practice run failed: staged changes detected."
            git diff --cached --stat
            exit 1
          fi
          current_sha=$(git rev-parse HEAD)
          if [ "$current_sha" != "$LIVE_BASELINE" ]; then
            echo "::error::Practice run failed: HEAD ($current_sha) differs from LIVE_BASELINE ($LIVE_BASELINE)."
            exit 1
          fi
          echo "Practice run guard passed: nothing staged and HEAD matches baseline."
